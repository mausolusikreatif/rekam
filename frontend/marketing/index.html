  <script>
    // Apply an explicit theme choice before first paint, so a reader who has
    // been in the app does not get a flash of the OS default on the way back
    // out to the marketing site. Same key the app writes.
    try {
      var t = localStorage.getItem('rekam.theme');
      if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
    } catch (_) {}
  </script>
