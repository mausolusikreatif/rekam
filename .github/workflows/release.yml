name: Release Solo

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build frontend
        run: REKAM_EDITION=solo npm run build
        working-directory: frontend

      - name: Test Solo
        run: go test -tags solo ./...

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -tags solo -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/rekam-solo-${os}-${arch}" ./cmd/rekam
          done
          (cd dist && sha256sum rekam-solo-* > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/*
